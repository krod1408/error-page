<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - End of the Line</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121113;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .top-tag {
            color: #ff3344;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .character-box {
            display: inline-block;
            width: 200px;
            height: 200px;
            margin-bottom: 2.5rem;
            filter: drop-shadow(0px 10px 25px rgba(255, 51, 68, 0.25));
        }

        .character-box svg {
            width: 100%;
            height: 100%;
            fill: #ff3344;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .divider {
            width: 40px;
            height: 3px;
            background-color: #ff3344;
            margin: 0 auto 1.5rem auto;
            border-radius: 2px;
        }

        p {
            color: #a0a0a5;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .cta-btn {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 2px solid #ffffff;
            padding: 0.75rem 2rem;
            border-radius: 4px;
            transition: all 0.2s ease-in-out;
        }

        .cta-btn:hover {
            background-color: #ffffff;
            color: #121113;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-tag">End of the road</div>
        
        <div class="character-box">
            <!-- Inline SVG Minimal Devil/Imp Silhouette -->
            <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                <path d="M12 2C11.5 2 11 2.5 11 3.5C11 4.5 11.5 5 12 5C12.5 5 13 4.5 13 3.5C13 2.5 12.5 2 12 2M5.5 3C4.1 3 3 4.1 3 5.5C3 6.9 4.1 8 5.5 8C5.9 8 6.2 7.9 6.5 7.7C5.6 9.1 5 10.7 5 12.5C5 16.4 8.1 19.5 12 19.5C15.9 19.5 19 16.4 19 12.5C19 10.7 18.4 9.1 17.5 7.7C17.8 7.9 18.1 8 18.5 8C19.9 8 21 6.9 21 5.5C21 4.1 19.9 3 18.5 3C17.5 3 16.6 3.6 16.2 4.5C15 3.6 13.6 3 12 3C10.4 3 9 3.6 7.8 4.5C7.4 3.6 6.5 3 5.5 3M9 10C9.6 10 10 10.4 10 11C10 11.6 9.6 12 9 12C8.4 12 8 11.6 8 11C8 10.4 8.4 10 9 10M15 10C15.6 10 16 10.4 16 11C16 11.6 15.6 12 15 12C14.4 12 14 11.6 14 11C14 10.4 14.4 10 15 10M12 14C13.5 14 14.5 15 14.5 15H9.5C9.5 15 10.5 14 12 14M11.5 21C9 21 7 21.8 7 22H17C17 21.8 15 21 12.5 21H11.5Z"/>
            </svg>
        </div>

        <h1>There is nothing for you here.</h1>
        
        <div class="divider"></div>
        
        <p>You have arrived at a destination without a map. There is no webpage waiting for you behind this door.</p>
        
        <a href="/" class="cta-btn">Turn back around</a>
    </div>

</body>
</html>
