<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - End of the Line</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121113;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .top-tag {
            color: #ff3344;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .character-box {
            display: inline-block;
            width: 200px;
            height: 200px;
            margin-bottom: 2.5rem;
            filter: drop-shadow(0px 10px 25px rgba(255, 51, 68, 0.25));
        }

        .character-box svg {
            width: 100%;
            height: 100%;
            fill: #ff3344;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .divider {
            width: 40px;
            height: 3px;
            background-color: #ff3344;
            margin: 0 auto 1.5rem auto;
            border-radius: 2px;
        }

        p {
            color: #a0a0a5;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .cta-btn {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 2px solid #ffffff;
            padding: 0.75rem 2rem;
            border-radius: 4px;
            transition: all 0.2s ease-in-out;
        }

        .cta-btn:hover {
            background-color: #ffffff;
            color: #121113;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-tag">End of the road</div>
        
        <div class="character-box">
    <!-- Sharp Devil/Imp Silhouette -->
    <svg viewBox="0 0 24 24" xmlns="http://w3.org">
        <path d="M12,2C11.64,4 9.17,4.86 7.62,5.21C6.2,5.53 4.54,4.6 4,4C4.31,5.25 5.25,7.74 7.05,8.81C5.23,10.23 4,12.47 4,15C4,19.42 7.58,23 12,23C16.42,23 20,19.42 20,15C20,12.47 18.77,10.23 16.95,8.81C18.75,7.74 19.69,5.25 20,4C19.46,4.6 17.8,5.53 16.38,5.21C14.83,4.86 12.36,4 12,2M9,13A1.5,1.5 0 0,1 10.5,14.5A1.5,1.5 0 0,1 9,16A1.5,1.5 0 0,1 7.5,14.5A1.5,1.5 0 0,1 9,13M15,13A1.5,1.5 0 0,1 16.5,14.5A1.5,1.5 0 0,1 15,16A1.5,1.5 0 0,1 13.5,14.5A1.5,1.5 0 0,1 15,13M12,17C13.67,17 15,18.33 15,20H9C9,18.33 10.33,17 12,17Z"/>
    </svg>
</div>

        <h1>There is nothing for you here.</h1>
        
        <div class="divider"></div>
        
        <p>You have arrived at a destination without a map. There is no webpage waiting for you behind this door.</p>
        
        <a href="/" class="cta-btn">Turn back around</a>
    </div>

</body>
</html>
